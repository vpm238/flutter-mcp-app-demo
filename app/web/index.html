<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Showtime — pick a date, a performance, and your seats.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1b2a4a">
  <title>Showtime</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: transparent;
      /* Flutter owns every pixel; stop iOS Safari from bouncing behind it. */
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    #boot {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      font: 500 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #8b8880;
      transition: opacity .25s ease;
    }
  </style>
</head>
<body>
  <div id="boot">Loading the box office…</div>

  <script>
  // ---------------------------------------------------------------------------
  // showtimeBridge — the view half of the MCP Apps relay.
  //
  // This document is the INNER frame. The `ui://` resource the MCP server hands
  // to the host is an outer shell that speaks MCP Apps proper and forwards
  // messages here over postMessage.
  //
  // Why two frames: MCP App views run under a CSP whose `script-src` has no
  // `wasm-unsafe-eval` (ext-apps#605), and CanvasKit is WebAssembly — so Flutter
  // cannot boot in the host's frame. CSP is per-document and is NOT inherited by
  // a cross-origin child, so nesting one frame served from our own origin gives
  // Flutter a policy it can actually run under. The shell keeps the protocol.
  //
  // When this page is opened directly (no parent, or a parent that never
  // answers), `ready()` rejects and the Dart side falls back to local fixtures.
  // ---------------------------------------------------------------------------
  (function () {
    if (window.parent === window) return; // opened as a normal web page

    var seq = 0;
    var pending = new Map();
    var contextHandlers = [];
    var resultHandlers = [];
    var readyPromise = null;

    function post(message) {
      window.parent.postMessage(Object.assign({ channel: 'showtime' }, message), '*');
    }

    function request(method, params) {
      var id = ++seq;
      return new Promise(function (resolve, reject) {
        var timer = setTimeout(function () {
          pending.delete(id);
          reject(new Error('showtime bridge: "' + method + '" timed out'));
        }, method === 'ready' ? 10000 : 20000);
        pending.set(id, {
          resolve: function (v) { clearTimeout(timer); resolve(v); },
          reject: function (e) { clearTimeout(timer); reject(e); },
        });
        post({ id: id, method: method, params: params || {} });
      });
    }

    window.addEventListener('message', function (event) {
      if (event.source !== window.parent) return;
      var data = event.data;
      if (!data || data.channel !== 'showtime') return;

      if (data.event === 'host-context') {
        contextHandlers.forEach(function (h) { h(data.payload); });
        return;
      }
      if (data.event === 'tool-result') {
        resultHandlers.forEach(function (h) { h(data.payload); });
        return;
      }

      var entry = pending.get(data.id);
      if (!entry) return;
      pending.delete(data.id);
      if (data.error) entry.reject(new Error(data.error));
      else entry.resolve(data.result);
    });

    window.showtimeBridge = {
      ready: function () {
        if (!readyPromise) readyPromise = request('ready');
        return readyPromise;
      },
      callTool: function (name, argsJson) {
        return request('callTool', { name: name, args: argsJson });
      },
      requestDisplayMode: function (mode) {
        return request('requestDisplayMode', { mode: mode });
      },
      sendMessage: function (text) { post({ method: 'sendMessage', params: { text: text } }); },
      updateModelContext: function (text) { post({ method: 'updateModelContext', params: { text: text } }); },
      setSize: function (width, height) { post({ method: 'setSize', params: { width: width, height: height } }); },
      log: function (level, message) { post({ method: 'log', params: { level: level, message: message } }); },
      beacon: function (stage, note) { post({ method: 'beacon', params: { stage: stage, note: note } }); },
      onHostContext: function (cb) { contextHandlers.push(cb); },
      onToolResult: function (cb) { resultHandlers.push(cb); },
    };
  })();
  </script>

  <script>
  window.addEventListener('flutter-first-frame', function () {
    var boot = document.getElementById('boot');
    if (boot) boot.remove();
  });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
