name: Deploy Showtime

# Builds the Flutter view, runs both test suites, and deploys the Worker that
# serves /mcp and /app/** to your Cloudflare account.
#
# Set two repository secrets first (Settings → Secrets and variables → Actions):
#
#   CLOUDFLARE_API_TOKEN    a token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID   from any Cloudflare dashboard URL, or `wrangler whoami`
#
# Then run this workflow from the Actions tab. The summary prints the URL to
# add to Claude as a custom connector.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "server/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-showtime
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the app was built and tested against.
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci

      - name: Test the server
        run: npm test

      - name: Test the view
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build the view and the bridge
        run: npm run build:all

      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. See the comment at the top of this workflow."
            exit 1
          fi
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          url="${{ steps.deploy.outputs.url }}"
          {
            echo "## Showtime is live"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| MCP endpoint | \`$url/mcp\` |"
            echo "| Standalone demo | $url/app/ |"
            echo "| As iOS / Android | $url/app/?persona=ios · $url/app/?persona=android |"
            echo
            echo "### Use it in Claude"
            echo
            echo "1. claude.ai → Settings → Connectors → **Add custom connector**"
            echo "2. Paste \`$url/mcp\`"
            echo "3. Ask *\"what's on at the Aurelia this weekend?\"* — the picker opens inline."
            echo
            echo "Open the standalone link on your phone to see the iOS or Android face."
          } >> "$GITHUB_STEP_SUMMARY"
